# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quality of life
set -g mouse on
set -g history-limit 50000
set -g focus-events on

# Warm dark theme matching the terminal palette
set -g status-style 'bg=#282420,fg=#e5c5a9'
set -g status-left '#[bg=#d0623c,fg=#282420,bold] #S '
set -g status-right '#[fg=#665e54] %a %b %d  #[fg=#f4ae2e]%H:%M '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bg=#3c332c,fg=#e5c5a9,bold] #I:#W '
set -g pane-border-style 'fg=#665e54'
set -g pane-active-border-style 'fg=#d0623c'
set -g message-style 'bg=#3c332c,fg=#e5c5a9'
set -g mode-style 'bg=#f4ae2e,fg=#282420'
